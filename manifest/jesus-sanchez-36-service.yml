# kubectl apply -f jesus-sanchez-36-service.yml
apiVersion: v1
kind: Service
metadata:
  name: jesus-sanchez-36-service
  namespace: jesus-sanchez-36-namespace
spec:
  type: NodePort      #30000-32767  # Cambia a LoadBalancer si estás en un entorno de nube
  ports:
  - port: 30001       # Puerto que el Service expondrá
    targetPort: 8085  # Puerto en el contenedor donde tu aplicación escucha
    nodePort: 30001   # Puerto asignado en el nodo, opcional
  selector:
    app: jesus-sanchez-36-deployment  # Debe coincidir con las etiquetas del Deployment