# MINIKUBE FUNCIONA EN CODESPACE | LOCAL
# KUBECTL FUNCIONA DIRECTO EN KILLERCODA (SIN MINIKUBE)

# consultar versión de minikube
minikube version

# consultar si minikube esta en start o stop
minikube status

# iniciar clúster kubernetes
minikube start

# ingresar a la carpeta de los manifiestos de kubernetes (manifest)
cd manifest

# listar namespace
kubectl get namespace
kubectl get ns

# crear un namespace "jesus-sanchez-36-namespace" por comando mediante un archivo: "jesus-sanchez-36-namespace.yml"
kubectl apply -f jesus-sanchez-36-namespace.yml

# consultar namespace en uso por "default" | LINUX
kubectl config view --minify | grep namespace

# consultar namespace en uso por "default" | WINDOWS
kubectl config view --minify | findstr namespace

# cambiar un namespace en uso por "default" a "jesus-sanchez-36-namespace"
kubectl config set-context --current --namespace=jesus-sanchez-36-namespace

# consultar todos los recursos de un namespace "jesus-sanchez-36-namespace"
kubectl get all -n jesus-sanchez-36-namespace

# consultar todos los recursos y secret de un namespace "jesus-sanchez-36-namespace"
kubectl get all,secrets -n jesus-sanchez-36-namespace

kubectl logs jesus-sanchez-36-deployment-58ffcb69df-58qnv -n jesus-sanchez-36-namespace --previous 2>&1 | grep -A 20 "Caused by"

# listar services del namespace "jesus-sanchez-36-namespace"
minikube service jesus-sanchez-36-service -n jesus-sanchez-36-namespace
minikube service list

# probar el microservicio dentro del clúster con curl
curl http://192.168.49.2:30001/v1/api/age-detector
curl http://192.168.49.2:30001/v1/api/age-detector/1

# crear un túnel de puerto la máquina local (host) y el clúster de Kubernetes
kubectl port-forward service/jesus-sanchez-36-service 8085:30001